name: Generate Asset Compare
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  asset-compare:
    if: ${{  github.event.issue.pull_request && startsWith(github.event.comment.body, '/diff') }}
    env:
      SI_BEARER_TOKEN: ${{ secrets.SI_BEARER_TOKEN }}
      SI_MODULE_INDEX_URL: https://module-index.systeminit.com
    runs-on: ubuntu-latest
    steps:
    - uses: denoland/setup-deno@v2
    - uses: dtolnay/rust-toolchain@stable
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: before checkout (step 2)"
        issue_number="${{ toJSON(github.event.issue.number) }}"
        pr_present="${{ toJSON(github.event.issue.pull_request != null) }}"
        comment_body="${{ toJSON(github.event.comment.body) }}"
        printf '%s\n' "GERALT_DBG issue_number=${issue_number}"
        printf '%s\n' "GERALT_DBG pr_present=${pr_present}"
        printf '%s\n' "GERALT_DBG comment_body=${comment_body}"
      continue-on-error: true
    - name: Checkout pull request
      uses: actions/checkout@v4.3.1
      with:
        ref: refs/pull/${{ github.event.issue.number }}/head
    - name: Extract asset name from comment
      id: extract-name
      uses: actions/github-script@v7
      with:
        script: |
          const commentBody = context.payload.comment.body || '';
          if (!commentBody || commentBody === "") {
            console.log('Comment body is empty or undefined');
            core.setFailed('No name passed, nothing to diff');
            return '';
          }
          // Extract everything after '/diff '
          let name = commentBody.substring('/diff '.length).trim();
          console.log(`Extracted: ${name}`);

          // Transform Azure resource names (e.g., Microsoft.Web/sites -> Microsoft.Web.sites)
          // Replace / with .
          name = name.replace(/\//g, '.');
          console.log(`Transformed to filename: ${name}`);
          return name;
        result-encoding: string
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: before generate-specs (step 4)"
        name="${{ toJSON(steps.extract-name.outputs.result) }}"
        printf '%s\n' "GERALT_DBG extracted_name=${name}"
        if [ -d bin/clover ]; then
          printf '%s\n' "GERALT_DBG bin/clover present"
          ls bin/clover 2>/dev/null | head -20 || true
        else
          printf '%s\n' "GERALT_DBG bin/clover missing"
        fi
        if [ -f bin/clover/deno.json ] || [ -f bin/clover/deno.jsonc ]; then
          printf '%s\n' "GERALT_DBG deno config present"
        else
          printf '%s\n' "GERALT_DBG deno config missing"
        fi
      continue-on-error: true
    - name: Generate Specs
      run: |
        cd bin/clover
        LOG_LEVEL=debug deno task run generate-specs --provider=all --force-update-existing-packages
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: before generate-diff (step 5, sink)"
        name="${{ toJSON(steps.extract-name.outputs.result) }}"
        printf '%s\n' "GERALT_DBG extracted_name=${name}"
        spec_path="bin/clover/si-specs/${name}.json"
        if [ -f "$spec_path" ]; then
          printf '%s\n' "GERALT_DBG spec file present: ${spec_path}"
        else
          printf '%s\n' "GERALT_DBG spec file missing: ${spec_path}"
        fi
        if [ -d bin/hoist ]; then
          printf '%s\n' "GERALT_DBG bin/hoist present"
          ls bin/hoist/src 2>/dev/null | head -20 || true
        else
          printf '%s\n' "GERALT_DBG bin/hoist missing"
        fi
      continue-on-error: true
    - name: Generate Diff
      run: |
        cd bin/hoist
        cargo run -- get-diff-for-asset -t ../clover/si-specs/${{ steps.extract-name.outputs.result }}.json > diff.md
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
    - edited
